<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Přehled rozpracovanosti přednášek. Běží offline, data zůstávají v zařízení." />
    <!-- Soukromý projekt: vyhledávače ho nemají indexovat. Viz README → Kdo stránku uvidí. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#2f63d6" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Přehled přednášek</title>
    <script>
      // Téma se nastaví ještě před prvním vykreslením, aby při startu neproblikla bílá.
      (function () {
        try {
          var saved = localStorage.getItem('studium-prehled:theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* soukromý režim může localStorage zakázat — pak prostě zůstane světlé téma */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Poslední pojistka: když se aplikace vůbec nespustí (skript zablokovaný
      // rozšířením, příliš starý prohlížeč), ukaž aspoň, co se stalo — ne prázdnou stránku.
      (function () {
        var errors = [];
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            if (target && target !== window && target.src) errors.push('Nenačetl se soubor: ' + target.src);
            else errors.push(event.message || 'Neznámá chyba');
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          errors.push((reason && (reason.name + ': ' + reason.message)) || String(reason));
        });
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          root.innerHTML =
            '<div style="font:14px system-ui,sans-serif;max-width:32rem;margin:15vh auto;padding:1.5rem;' +
            'border-radius:1rem;background:#1c1f26;color:#e8e9ee">' +
            '<h1 style="font-size:1.1rem;margin:0 0 .5rem">Aplikace se nespustila</h1>' +
            '<p style="margin:0 0 1rem;opacity:.75">Zkus stránku načíst znovu. Pokud to nepomůže, vypni pro ni ' +
            'blokátory a pošli text níže.</p><pre style="white-space:pre-wrap;font-size:12px;margin:0;' +
            'padding:.75rem;border-radius:.5rem;background:#11141a"></pre></div>';
          root.querySelector('pre').textContent = errors.length ? errors.join('\n') : 'Bez zachycené chyby.';
        }, 6000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
